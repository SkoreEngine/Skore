# Apex quality gates for Skore (CMake + Ninja + CTest).
# Companion format: KalstrixOrg/apex docs/CHECKS_YAML_EXAMPLES.md §4.
#
# Rules that bite:
# - No shell (no &&, pipes, redirection) — argv-split only
# - Order matters within each stage (fast then deep)
# - Loaded from origin/<goalBranch>, not a dirty worktree-only copy
#
# Runner needs on PATH: cmake, ninja, ctest, a C compiler, bash, clang-format,
# clang, clang-tidy, cppcheck, and MinGW (x86_64-w64-mingw32-gcc) for windows-abi.
# (format / cppcheck / windows-abi use scripts/*; build uses -G Ninja per AGENTS.md.)
#
# Linux host packages for windows-abi:
#   Debian/Ubuntu: sudo apt-get install -y mingw-w64 clang clang-tidy g++-mingw-w64-x86-64
#   Fedora/RHEL:   sudo dnf install -y mingw64-gcc mingw64-headers clang clang-tools-extra

version: 1

defaults:
  timeoutSeconds: 600
  workdir: .

checks:
  # --- Layer 1: fast --------------------------------------------------------

  - id: format
    stage: fast
    run: bash scripts/format.sh --check
    fix: bash scripts/format.sh
    blocking: true
    timeoutSeconds: 120

  # LLP64 / Windows type-model tidy (no MSVC). Independent of cmake build dir.
  # Catches Linux-only cast patterns (e.g. readability-redundant-casting) early.
  - id: windows-abi
    stage: fast
    run: bash scripts/check-windows-abi.sh
    blocking: true
    timeoutSeconds: 900

  - id: cmake-configure
    stage: fast
    run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    blocking: true
    timeoutSeconds: 300

  - id: cppcheck
    stage: fast
    run: bash scripts/cppcheck.sh
    blocking: true
    timeoutSeconds: 600

  - id: cmake-build
    stage: fast
    run: cmake --build build
    blocking: true
    timeoutSeconds: 900

  # Unit + smoke only. Integration binaries (Vulkan / UI capture / lavapipe)
  # skip unless SK_RUN_INTEGRATION=1 — that is the 12+ min default-ctest cost.
  - id: ctest
    stage: fast
    run: ctest --test-dir build --output-on-failure
    blocking: true
    timeoutSeconds: 400

  # --- Layer 2: deep --------------------------------------------------------
  # GPU / device / UI-capture suite once. Do not re-run unit tests.
  # (test-integrity still runs automatically when any check exists.)

  - id: ctest-full
    stage: deep
    run: cmake -E env SK_RUN_INTEGRATION=1 ctest --test-dir build --output-on-failure -j 4 -L integration
    blocking: true
    timeoutSeconds: 1800
