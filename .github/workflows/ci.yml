# Build and run tests on Windows, Linux, and macOS (Debug + Release).
# Matches project conventions: CMake + Ninja.
# Debug: SK_TESTS on host and plugins.
# Release: production binaries; host tests still run (plugin test export omitted).

name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.config.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        config:
          - name: Windows (MSVC)
            os: windows-latest
          - name: Linux (GCC)
            os: ubuntu-latest
          - name: macOS (AppleClang)
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang-tidy \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxkbcommon-dev libgl-dev \
            mesa-vulkan-drivers vulkan-tools

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # clang-tidy is required (SK_ENABLE_CLANG_TIDY defaults ON; hard fail if missing).
      # Windows: prefer VS-bundled LLVM tidy; fall back to Chocolatey LLVM.
      - name: Ensure clang-tidy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\clang-tidy.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\clang-tidy.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin\clang-tidy.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\18\Community\VC\Tools\Llvm\x64\bin\clang-tidy.exe",
            "${env:ProgramFiles}\LLVM\bin\clang-tidy.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install llvm -y
            $found = "${env:ProgramFiles}\LLVM\bin\clang-tidy.exe"
          }
          if (-not (Test-Path $found)) { throw "clang-tidy not found after install" }
          $dir = Split-Path $found -Parent
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & $found --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DSK_ENABLE_CLANG_TIDY=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test (Linux + lavapipe)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure --verbose
        env:
          # Headless Vulkan for UI capture / integration tests.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure --verbose

      - name: Upload test artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.config.name }}-${{ matrix.build_type }}
          path: build/test-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # APX-263: dedicated UI integration job (widget-vision, flexbox, interaction).
  # Structural + behavioural always run. Live vision grades only when the
  # optional XAI_API_KEY secret is present; otherwise vision SKIP is logged
  # clearly (Unity IGNORE) — never a silent pass. Fail frames upload below.
  ui-integration:
    name: UI integration suites (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            python3 \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxkbcommon-dev libgl-dev \
            mesa-vulkan-drivers vulkan-tools

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DSK_ENABLE_CLANG_TIDY=OFF

      - name: Run UI integration suites
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          SK_TEST_ARTIFACT_DIR: ${{ github.workspace }}/build/test-artifacts
          # Optional org/repo secret — when absent, vision grades SKIP with a clear message.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SK_UI_VISION_API_KEY: ${{ secrets.SK_UI_VISION_API_KEY }}
        run: bash scripts/run-ui-integration-tests.sh

      - name: Upload UI test artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-integration-test-artifacts
          path: |
            build/test-artifacts/
            build/test-artifacts/**/*_vision_fail.png
          if-no-files-found: ignore
          retention-days: 14

  # APX-174 ran the suite twice (default v1 path + SK_COMPRESSION_USE_V2=1) to
  # exercise both sides of the staged v1→v2 migration flag. APX-164 completed
  # the migration: the flag and the legacy v1 path were removed, so the single
  # run above is the only required state (wire compatibility with main is
  # frozen by the APX-176 compat vectors in sk-tests).

  # Windows LLP64 type/cast checks on Linux (MinGW sysroot + clang-tidy).
  # Catches agent-blind issues (e.g. readability-redundant-casting) without MSVC.
  windows-abi:
    name: Windows ABI (MinGW tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # clang provides -print-resource-dir (intrinsics); do not use GCC's
          # lib/gcc/.../include with clang-tidy — that conflicts with builtins.
          sudo apt-get install -y mingw-w64 clang clang-tidy g++-mingw-w64-x86-64

      - name: Windows ABI check
        run: bash scripts/check-windows-abi.sh

  # Static analysis: cppcheck once on Linux (compile_commands.json).
  # First-party only; thirdparty excluded (see scripts/cppcheck.sh).
  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cppcheck \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxkbcommon-dev libgl-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DSK_ENABLE_CLANG_TIDY=OFF

      - name: Cppcheck
        run: bash scripts/cppcheck.sh
